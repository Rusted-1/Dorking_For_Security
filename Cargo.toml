[package]
name = "dorker"
version = "0.1.0"
edition = "2021"
description = "Anti-fraud dorking tool: discover candidate pages, check them for scam-boilerplate keywords, and organize the hits."
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
scraper = "0.20"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"

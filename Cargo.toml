[package]
name = "dorker"
version = "0.1.0"
edition = "2021"
description = "Anti-fraud dorking tool: discover candidate pages, check them for scam-boilerplate keywords, and organize the hits."
license = "MIT"

[dependencies]
# Single-threaded runtime: the work is network-bound, so concurrency comes
# from overlapping requests, not extra threads.
tokio = { version = "1", features = ["rt", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
anyhow = "1"
regex = "1"
# Already pulled in by regex; used directly to match every keyword in one pass.
aho-corasick = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
tiny_http = "0.12"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

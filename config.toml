# Dorker run configuration.

keywords_file = "keywords.json"
output_dir = "out"

[fetch]
# Politeness controls. Keep delay_ms reasonably high so you never hammer a host.
delay_ms = 1500
timeout_secs = 20
user_agent = "Dorker/0.1 (+anti-fraud research; put a real contact address here)"
respect_robots = true

# --- Candidate source -------------------------------------------------------
# Option A (works out of the box, no API key): check a local list of URLs.
[source]
kind = "url_list"
path = "candidates.txt"

# Option B: auto-discover candidates through the Google Programmable Search API.
# Comment out the block above and uncomment this one once you have a key + cx,
# then run:  dorker discover --config config.toml          (writes discovered.txt)
#            dorker discover --config config.toml --scan    (discover + scan)
# [source]
# kind = "search_api"
# provider = "google_cse"
# api_key = "YOUR_API_KEY"
# cx = "YOUR_SEARCH_ENGINE_ID"
# max_results = 50
# # Leave queries empty to auto-generate dorks from keywords.json (recommended),
# # or list your own to override:
# queries = []
#
# NOTE: with queries = [], dorker builds the dork queries itself from your
# fingerprint list — quoted phrases for the distinctive categories, plus each
# tagline combined with the inurl: filters. The Custom Search JSON API honors
# `inurl:` less reliably than regular Google web search, which is why the
# combos pair it with a strong phrase; the url-target keywords in keywords.json
# also re-apply the signup/register filter at scan time regardless.

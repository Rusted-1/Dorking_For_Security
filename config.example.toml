# Dorker run configuration.

keywords_file = "keywords.json"
output_dir = "out"

[fetch]
# Politeness controls. Keep delay_ms reasonably high so you never hammer a host.
delay_ms = 1500
timeout_secs = 20
user_agent = "Dorker/0.1 (+anti-fraud research; put a real contact address here)"
respect_robots = true

# --- Candidate source -------------------------------------------------------
# Option A (works out of the box, no API key): check a local list of URLs.
[source]
kind = "url_list"
path = "candidates.txt"

# Option B: auto-discover candidates through a search API (Serper — real
# Google results via a simple key from https://serper.dev, free credits).
# Easiest via `dorker setup` or the panel's Setup form, which write this for
# you. Then run:  dorker discover --config config.toml          (writes discovered.txt)
#                 dorker discover --config config.toml --scan    (discover + scan)
# [source]
# kind = "search_api"
# provider = "serper"
# api_key = "YOUR_SERPER_KEY"
# cx = ""                      # not used by serper (only google_cse needs it)
# max_results = 50
# # Leave queries empty to auto-generate dorks from keywords.json (recommended),
# # or list your own to override:
# queries = []
#
# NOTE: with queries = [], dorker builds the dork queries from your fingerprint
# list — quoted phrases for the distinctive categories, plus each tagline
# combined with the inurl: filters.
#
# provider = "google_cse" is still supported for anyone who already has a
# Google Custom Search key (api_key + cx), but Google has closed that API to
# new sign-ups, so new users should use serper.

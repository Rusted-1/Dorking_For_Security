name: ci

# Build and run the offline unit tests on every push and pull request.
# The tests never contact the internet (no Serper calls, no site fetches).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build
      - name: Unit tests (offline)
        run: cargo test

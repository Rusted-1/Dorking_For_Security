name: ci

# Build and run the offline unit tests on every push and pull request.
# The tests never contact the internet (no Serper calls, no site fetches).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build
      - name: Unit tests (offline)
        run: cargo test

  # Builds the Windows release binary (no upload) and reports its size.
  release-size:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM (needed to build the TLS crypto library)
        run: choco install nasm -y
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Report binary size
        shell: pwsh
        run: |
          $b = (Get-Item target/release/dorker.exe).Length
          "dorker.exe: $b bytes ($([math]::Round($b / 1MB, 2)) MB)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          "::notice title=dorker.exe size::$b bytes"

name: gitleaks

# Secret scanning in the pipeline: every push and pull request is scanned, so
# an API key or private key can't reach GitHub unnoticed. Full history is
# checked (fetch-depth: 0), not just the latest change.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

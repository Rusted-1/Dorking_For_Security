# Dorker offline test lab config. Discovery goes to the fake Serper on
# localhost, so no credits are used and no real site is contacted.
# The lab scripts copy this file into testlab/out/ before each run.

keywords_file = "keywords.json"
output_dir = "testlab/out"

[fetch]
delay_ms = 150
timeout_secs = 10
user_agent = "Dorker/0.1 (+offline test lab)"
respect_robots = true

[source]
kind = "search_api"
provider = "serper"
# Filled in as "lab-fake-key" by the lab scripts in their working copy
# (testlab/out/lab-config.toml); kept empty here for the secret scanners.
api_key = ""
serper_endpoint = "http://localhost:8600/search"
max_results = 50
results_per_query = 10
max_queries_per_run = 3
rescan_after_days = 30
skip_domains = ["skipme.invalid"]
queries = []
